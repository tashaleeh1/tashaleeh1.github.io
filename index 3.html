*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
svg{flex-shrink:0}
.num,.tn{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--tag-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ───────── header ───────── */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:14px;height:var(--hdr-h)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-mark{width:38px;height:38px;display:grid;place-items:center;color:var(--tag-ink)}
.logo-name{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;letter-spacing:0}
.logo-sub{font-size:11px;color:var(--ink-3);line-height:1;margin-top:4px}
.hdr-search{flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:0;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;height:44px;padding-inline:4px 6px;transition:border-color .15s,box-shadow .15s}
.hdr-search:focus-within{border-color:var(--ink-3);box-shadow:0 0 0 3px var(--focus)}
.hdr-search input{flex:1;min-width:0;border:0;background:transparent;height:100%;padding-inline:8px;outline:none;font-size:14.5px}
.hdr-search input::placeholder{color:var(--ink-3)}
.car-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding-inline:10px;border-radius:9px;border:0;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;white-space:nowrap;max-width:46%}
.car-chip .ell{max-width:150px}
.car-chip:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.hdr-nav{display:flex;align-items:center;gap:2px}
.hdr-nav a{display:inline-flex;align-items:center;height:38px;padding-inline:12px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.hdr-nav a:hover{background:var(--paper);color:var(--ink)}
.hdr-nav a.on{color:var(--ink);background:var(--surface-2)}
.hdr-acts{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
.dot-count{position:absolute;top:4px;inset-inline-end:3px;min-width:18px;height:18px;padding-inline:5px;border-radius:9px;background:var(--alert);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;border:2px solid var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px}
.role-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding-inline:10px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:12px;font-weight:700;border:0}
.hdr-row2{display:none}

/* ───────── bottom tabs (phone) ───────── */
.tabs{display:none}
@media (max-width:899px){
  :root{--hdr-h:58px}
  .hdr-nav,.hdr .hdr-search.d,.hide-m{display:none!important}
  .hdr-row2{display:flex;padding-bottom:10px}
  .hdr-row2 .hdr-search{max-width:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0 0;z-index:55;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:600;padding-block:4px;border-radius:10px}
  .tabs a.on{color:var(--ink)}
  .tabs a.on svg{stroke-width:2.2}
  .tabs .tab-main{position:relative}
  .tabs .tab-main span.fab{width:52px;height:52px;margin-top:-22px;border-radius:16px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;
    box-shadow:0 6px 16px -6px color-mix(in srgb,var(--tag) 75%,transparent),0 0 0 4px var(--surface)}
  .tabs .tab-main{color:var(--ink)}
  main.page{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:900px){ .show-m{display:none!important} }

main.page{padding-block:28px 64px;min-height:60vh}

/* ───────── buttons ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding-inline:18px;border-radius:10px;border:0;font-weight:600;
  font-size:14.5px;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .05s;line-height:1}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:color-mix(in srgb,var(--ink) 86%,var(--paper))}
.btn-tag{background:var(--tag);color:var(--tag-ink)}
.btn-tag:hover{background:var(--tag-2)}
.btn-trust{background:var(--trust);color:var(--on-trust)}
.btn-trust:hover{background:color-mix(in srgb,var(--trust) 88%,var(--ink))}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--alert-soft);color:var(--alert)}
.btn-sm{height:36px;padding-inline:13px;font-size:13.5px;border-radius:9px}
.btn-lg{height:52px;padding-inline:22px;font-size:16px;border-radius:12px}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.link:hover{text-decoration-color:var(--ink)}

/* ───────── form ───────── */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--alert);font-weight:600}
.inp,.sel,.txa{width:100%;height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding-inline:12px;outline:none;
  transition:border-color .15s,box-shadow .15s;font-size:15px}
.txa{height:auto;min-height:96px;padding-block:10px;resize:vertical;line-height:1.6}
.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:left 16px center,left 11px center;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:12px;padding-inline-end:12px}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--ink-3);box-shadow:0 0 0 3px var(--focus)}
.inp.bad{border-color:var(--alert)}
.inp.good{border-color:var(--trust)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:14px;border-radius:999px;border:0;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line-2);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.sm{height:30px;padding-inline:11px;font-size:12.5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:34px;padding-inline:14px;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600;font-size:14px}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;margin:0;transition:background .2s;flex-shrink:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--trust)}
.switch input:checked::after{inset-inline-start:21px}
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);cursor:pointer}
.radio-card:has(input:checked){box-shadow:inset 0 0 0 2px var(--ink)}
.radio-card input{margin-top:4px;accent-color:var(--ink);width:18px;height:18px;flex-shrink:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--trust);flex-shrink:0}

/* ───────── surfaces ───────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:20px}
.pad-l{padding:24px}
@media (max-width:640px){.pad-l{padding:18px}.pad{padding:16px}}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:22px}
.sec-h .sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:0}
.page-h .sub{color:var(--ink-2);margin-top:4px;max-width:62ch}
@media (max-width:640px){.page-h h1{font-size:25px}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--ink)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-bottom:14px}
.crumbs a{text-decoration:none;color:var(--ink-2)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.divider{height:1px;background:var(--line);border:0;margin:0}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px 18px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:600;min-width:0}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.layout-2.rev{grid-template-columns:300px minmax(0,1fr)}
@media (max-width:999px){.layout-2,.layout-2.rev{grid-template-columns:1fr}}
.sticky{position:sticky;top:calc(var(--hdr-h) + 20px)}
@media (max-width:999px){.sticky{position:static}}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding-inline:10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.p-trust{background:var(--trust-soft);color:var(--trust)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-alert{background:var(--alert-soft);color:var(--alert)}
.p-mute{background:var(--surface-2);color:var(--ink-2)}
.p-tag{background:var(--tag);color:var(--tag-ink)}
.live::before{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* condition stamps */
.cond{display:inline-flex;align-items:center;gap:5px;height:24px;padding-inline:8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1;white-space:nowrap}
.cond.oem{background:var(--trust-soft);color:var(--trust)}
.cond.after{background:var(--info-soft);color:var(--info)}
.cond.used{background:var(--warn-soft);color:var(--warn)}
.grade{font-family:var(--f-mono);font-weight:600;padding-inline-start:5px;margin-inline-start:2px;border-inline-start:1px solid currentColor;opacity:.9}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--trust);font-size:12px;font-weight:700}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px}
.stars svg{color:var(--star)}

/* ───────── price tag (yard tag) ───────── */
.ptag{position:relative;display:inline-flex;align-items:baseline;gap:4px;background:var(--tag);color:var(--tag-ink);height:32px;align-items:center;
  padding-inline:12px 22px;font-weight:700;font-size:16px;line-height:1;
  clip-path:polygon(0 50%,13px 0,100% 0,100% 100%,13px 100%);border-radius:0 6px 6px 0}
.ptag::after{content:"";position:absolute;inset-inline-end:auto;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px rgba(39,30,0,.35)}
.ptag small{font-size:11px;font-weight:600;opacity:.8}
.ptag.lg{height:46px;font-size:26px;padding-inline:16px 30px;clip-path:polygon(0 50%,18px 0,100% 0,100% 100%,18px 100%)}
.ptag.lg::after{left:13px;width:9px;height:9px;margin-top:-4.5px}
.ptag.lg small{font-size:14px}
.strike{text-decoration:line-through;color:var(--ink-3);font-size:13px}

/* ───────── catalog plate (part drawing) ───────── */
.plate-drw{position:relative;aspect-ratio:4/3;max-width:100%;background-color:var(--bp);color:var(--bp-ink);overflow:hidden;
  background-image:linear-gradient(var(--bp-line) 1px,transparent 1px),linear-gradient(90deg,var(--bp-line) 1px,transparent 1px);
  background-size:20px 20px;background-position:-1px -1px}
.plate-drw>svg.drw{position:absolute;inset:12% 14% 16%;width:72%;height:72%}
.plate-drw .callout{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:0;direction:ltr}
.plate-drw .callout i{display:block;width:30px;height:1.2px;background:currentColor;opacity:.55;transform-origin:right center;transform:rotate(-30deg);margin-right:-1px}
.plate-drw .callout b{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--bp)}
.plate-drw .oemno{position:absolute;bottom:8px;left:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;opacity:.8;direction:ltr}
.plate-drw .stamp{position:absolute;top:10px;right:10px}
.plate-drw img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ───────── part card ───────── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.pgrid.tight{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media (max-width:520px){.pgrid,.pgrid.tight{grid-template-columns:1fr 1fr;gap:10px}}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;
  transition:border-color .15s,box-shadow .15s;position:relative;min-width:0}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pcard .plate-drw{border-bottom:1px solid var(--line)}
.pcard-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pcard-t{font-weight:700;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.pcard-m{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;min-width:0}
.pcard-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.fit-ok{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--trust)}
.fav{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:34px;height:34px;border-radius:10px;border:0;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fav.on{color:var(--alert)}
.fav.on svg{fill:currentColor}
@media (max-width:520px){
  .pcard-b{padding:10px 10px 12px}
  .pcard-t{font-size:13.5px}
  .ptag{height:28px;font-size:14px;padding-inline:9px 19px}
  .pcard .cond{font-size:11px;height:22px;padding-inline:6px}
}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,240px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
.hscroll>*{scroll-snap-align:start}

/* ───────── home ───────── */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:12px 8px}
@media (max-width:999px){.hero{grid-template-columns:1fr;gap:26px}}
.hero h1{font-family:var(--f-display);font-size:clamp(32px,4.8vw,54px);line-height:1.25;font-weight:800;letter-spacing:0}
.hero .lede{font-size:17px;color:var(--ink-2);max-width:52ch;margin-top:16px;line-height:1.8}
.hero-proof{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:13.5px;color:var(--ink-2)}
.hero-proof span{display:inline-flex;align-items:center;gap:6px}
.hero-proof svg{color:var(--trust)}

/* VIN plate */
.vinbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.vinplate{position:relative;border-radius:8px;padding:16px 18px 12px;color:var(--plate-ink);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),linear-gradient(160deg,var(--plate-a),var(--plate-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px var(--line-2)}
.vinplate .rivet{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.85),var(--plate-b) 60%,rgba(0,0,0,.35));}
.vinplate .rivet:nth-of-type(1){top:7px;left:7px}.vinplate .rivet:nth-of-type(2){top:7px;right:7px}
.vinplate .rivet:nth-of-type(3){bottom:7px;left:7px}.vinplate .rivet:nth-of-type(4){bottom:7px;right:7px}
.vin-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:700;opacity:.75;padding-inline:4px;margin-bottom:8px}
.vin-top .mono{font-size:11px}
.vin-cells{position:relative;display:grid;grid-template-columns:repeat(17,1fr);gap:3px;direction:ltr}
.vin-cells .c{height:40px;display:grid;place-items:center;border-radius:4px;background:rgba(255,255,255,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.18);
  font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--plate-ink);min-width:0}
:root[data-theme="dark"] .vin-cells .c{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vin-cells .c{background:rgba(0,0,0,.25)}}
.vin-cells .c.cur{box-shadow:inset 0 0 0 2px var(--tag-2)}
.vin-cells .c.g1{margin-right:0}
.vin-cells input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:text;direction:ltr;text-transform:uppercase}
.vin-groups{display:grid;grid-template-columns:3fr 6fr 8fr;gap:3px;direction:ltr;margin-top:6px}
.vin-groups span{font-size:10.5px;font-weight:600;opacity:.7;border-top:1.5px solid currentColor;padding-top:3px;text-align:center;direction:rtl}
@media (max-width:520px){.vin-cells{gap:2px}.vin-cells .c{height:32px;font-size:13px;border-radius:3px}.vinplate{padding:14px 10px 10px}.vin-groups span{font-size:9.5px}.vinbox{padding:16px}}
.vin-out{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.vin-res{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--trust-soft);color:var(--ink)}
.vin-res.warn{background:var(--warn-soft)}
.vin-res .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--trust);flex-shrink:0}
.vin-res.warn .ic{color:var(--warn)}

.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.paths{grid-template-columns:1fr}}
.path{display:flex;gap:14px;align-items:flex-start;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.path:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.path .pi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex-shrink:0}
.path.main{background:var(--tag);border-color:var(--tag-2);color:var(--tag-ink)}
.path.main .pi{background:rgba(255,255,255,.55)}
.path h3{font-size:17px}
.path p{font-size:13.5px;margin-top:4px;opacity:.85;line-height:1.6}
.path .go{margin-top:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px}

.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:860px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.cats{grid-template-columns:repeat(2,1fr);gap:10px}}
.cat{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;text-align:start;padding:0}
.cat:hover{border-color:var(--ink-3)}
.cat .plate-drw{aspect-ratio:16/10;border-bottom:1px solid var(--line)}
.cat .plate-drw>svg.drw{inset:14% 18% 14%;width:64%;height:72%}
.cat .ct{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14px}
.cat .ct span.n{font-weight:500;font-size:12px;color:var(--ink-3)}

.feed{display:flex;flex-direction:column}
.feed-i{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line-2)}
.feed-i:last-child{border-bottom:0}
.feed-i .fi{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}

.escrow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:st;position:relative}
@media (max-width:860px){.escrow{grid-template-columns:1fr 1fr;gap:18px 0}}
@media (max-width:480px){.escrow{grid-template-columns:1fr}}
.esc-s{position:relative;padding-inline-end:22px}
.esc-s .n{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.esc-s .n b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;background:var(--surface);border:1.5px solid var(--ink);flex-shrink:0}
.esc-s .n i{flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 10px)}
.esc-s:last-child .n i{display:none}
.esc-s h3{font-size:16px;margin-bottom:4px}
.esc-s p{font-size:13.5px;color:var(--ink-2);line-height:1.65}
.esc-s.lock .n b{background:var(--trust);border-color:var(--trust);color:var(--on-trust)}
.band{background:var(--ink);color:var(--paper);border-radius:22px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center}
.band h2{font-family:var(--f-display);font-size:30px}
.band p{color:color-mix(in srgb,var(--paper) 75%,transparent);margin-top:8px;max-width:58ch}
@media (max-width:760px){.band{grid-template-columns:1fr;padding:24px}.band h2{font-size:24px}}

/* yard card */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ycard{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.ycard:hover{border-color:var(--ink-3)}
.yav{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--ink);color:var(--paper);flex-shrink:0}
.yav.store{background:var(--info-soft);color:var(--info)}
.yav.lg{width:72px;height:72px;font-size:30px;border-radius:18px}
.ystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ystats div{display:flex;flex-direction:column}
.ystats b{font-size:15px}
.ystats span{font-size:11.5px;color:var(--ink-3)}
.mk-chips{display:flex;flex-wrap:wrap;gap:5px}
.mk-chips span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}

/* ───────── filters ───────── */
.filters{display:flex;flex-direction:column;gap:20px}
.filters h4{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.fit-toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:46px 20px;border:1.5px dashed var(--line-2);border-radius:18px;background:var(--surface)}
.empty .ei{width:64px;height:64px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);margin-bottom:4px}
.empty h3{font-size:19px}
.empty p{color:var(--ink-2);max-width:46ch;font-size:14px}

/* ───────── part detail ───────── */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:899px){.pd{grid-template-columns:1fr;gap:18px}}
.pd .plate-drw{border-radius:18px;border:1px solid var(--line)}
.pd-title{font-family:var(--f-display);font-size:30px;line-height:1.3}
@media (max-width:640px){.pd-title{font-size:23px}}
.fitbox{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px}
.fitbox.ok{background:var(--trust-soft)}
.fitbox.no{background:var(--alert-soft)}
.fitbox.unk{background:var(--warn-soft)}
.fitbox .fi{flex-shrink:0;margin-top:2px}
.fitbox.ok .fi{color:var(--trust)}.fitbox.no .fi{color:var(--alert)}.fitbox.unk .fi{color:var(--warn)}
.safe-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:12px 14px;border-radius:12px;background:var(--paper);border:1px dashed var(--line-2)}
.safe-note svg{color:var(--trust);margin-top:2px}
.cmp{display:flex;flex-direction:column}
.cmp a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.cmp a:last-child{border-bottom:0}
.cmp a.cur{opacity:.55;pointer-events:none}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{width:72px;height:56px;border-radius:9px;overflow:hidden;border:1.5px solid var(--line);padding:0;background:var(--bp);flex-shrink:0}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* ───────── request / offers ───────── */
.form-sec{display:flex;flex-direction:column;gap:14px;padding-block:22px;border-bottom:1px solid var(--line)}
.form-sec:first-child{padding-top:0}
.form-sec:last-of-type{border-bottom:0}
.form-sec h3{font-size:16px;display:flex;align-items:center;gap:10px}
.form-sec h3 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-family:var(--f-mono)}
.uploads{display:flex;gap:10px;flex-wrap:wrap}
.up-add{width:92px;height:92px;border-radius:12px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--ink-2);cursor:pointer;background:var(--paper);position:relative}
.up-add:hover{border-color:var(--ink-3);color:var(--ink)}
.up-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up-img{width:92px;height:92px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.up-img img{width:100%;height:100%;object-fit:cover}
.up-img button{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.reach{display:flex;flex-direction:column;gap:10px}
.reach .big{font-family:var(--f-display);font-size:40px;line-height:1}
.offer{display:grid;grid-template-columns:var(--oc,96px) minmax(0,1fr) auto;gap:16px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);align-items:start}
.offer.best{border-color:var(--trust);box-shadow:inset 0 0 0 1px var(--trust)}
.offer.accepted{border-color:var(--trust);background:var(--trust-soft)}
.offer.dim{opacity:.55}
.offer .plate-drw{border-radius:10px;border:1px solid var(--line)}
.offer-acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
@media (max-width:700px){.offer{grid-template-columns:72px minmax(0,1fr)}.offer-acts{grid-column:1/-1;flex-direction:row;min-width:0}.offer-acts .btn{flex:1}}
.offer-new{animation:arrive .5s ease-out}
@keyframes arrive{from{background:var(--tag);}to{background:var(--surface)}}
.meta-line{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.meta-line span{display:inline-flex;align-items:center;gap:5px}

/* timeline */
.tl{display:flex;flex-direction:column;position:relative}
.tl-i{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;top:28px;bottom:0;inset-inline-start:14px;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-i.done::before{background:var(--trust)}
.tl-d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line-2);color:var(--ink-3);position:relative;z-index:1}
.tl-i.done .tl-d{background:var(--trust);box-shadow:none;color:var(--on-trust)}
.tl-i.now .tl-d{background:var(--tag);box-shadow:none;color:var(--tag-ink)}
.tl-i.bad .tl-d{background:var(--alert);box-shadow:none;color:#fff}
.tl-t{font-weight:700;font-size:14.5px;padding-top:3px}
.tl-s{font-size:13px;color:var(--ink-2)}

/* vault (escrow panel) */
.vault{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--trust-soft);color:var(--ink)}
.vault .vi{width:52px;height:52px;border-radius:14px;background:var(--trust);color:var(--on-trust);display:grid;place-items:center;flex-shrink:0}
.vault.released .vi{background:var(--ink);color:var(--paper)}
.vault.disputed{background:var(--alert-soft)}
.vault.disputed .vi{background:var(--alert);color:#fff}
.vault.refunded{background:var(--info-soft)}
.vault.refunded .vi{background:var(--info);color:var(--surface)}
.vault .amt{font-family:var(--f-display);font-size:28px;line-height:1.1}
.meter{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--trust);border-radius:4px}

/* list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.li:last-child{border-bottom:0}
a.li:hover{background:var(--paper)}
.li .th{width:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.li .th .plate-drw{aspect-ratio:4/3}
.li .t{font-weight:700;font-size:14.5px}
.li .s{font-size:12.5px;color:var(--ink-2)}
@media (max-width:560px){.li{grid-template-columns:auto minmax(0,1fr)}.li>.end{grid-column:2}.li .th{width:54px}}

/* ───────── chat ───────── */
.chat{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - var(--hdr-h) - 120px);min-height:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
@media (max-width:899px){.chat{grid-template-columns:1fr;height:auto;min-height:0;border:0;background:transparent;border-radius:0}.chat.has-thread .chat-list{display:none}.chat:not(.has-thread) .chat-main{display:none}}
.chat-list{border-inline-end:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
@media (max-width:899px){.chat-list{border:1px solid var(--line);border-radius:16px;background:var(--surface)}}
.ci{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ci:hover{background:var(--paper)}
.ci.on{background:var(--surface-2)}
.ci .badge{min-width:20px;height:20px;padding-inline:6px;border-radius:10px;background:var(--trust);color:var(--on-trust);font-size:11px;font-weight:700;display:grid;place-items:center}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0}
@media (max-width:899px){.chat-main{height:calc(100vh - var(--hdr-h) - 190px - env(safe-area-inset-bottom,0px));min-height:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-guard{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--trust);background:var(--trust-soft);padding:8px 14px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--ink);color:var(--paper);border-end-start-radius:4px}
.msg.them{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.msg .tm{font-size:11px;opacity:.6;margin-top:4px;display:block}
.msg img{border-radius:10px;margin-bottom:6px;max-height:220px;object-fit:cover}
.msg .masked{background:var(--alert-soft);color:var(--alert);padding:0 6px;border-radius:5px;font-weight:700;font-size:13px;white-space:nowrap}
.msg.me .masked{background:rgba(255,128,112,.25)}
.sysmsg{align-self:center;max-width:90%;text-align:center;font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:10px;display:flex;gap:6px;align-items:flex-start}
.offer-bubble{align-self:flex-end;width:min(320px,86%);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.offer-bubble .ob-h{padding:10px 14px;background:var(--tag);color:var(--tag-ink);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.offer-bubble .ob-b{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.typing{align-self:flex-end;display:flex;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center;background:var(--surface)}
.composer .inp{border-radius:999px;height:44px}
.composer .att{position:relative;overflow:hidden}
.composer .att input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ───────── modal / sheet ───────── */
.scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.dlg{width:min(560px,100%);max-height:calc(100vh - 40px);overflow-y:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:rise .22s cubic-bezier(.2,.8,.3,1)}
.dlg.wide{width:min(760px,100%)}
.dlg.narrow{width:min(420px,100%)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 0}
.dlg-h h2{font-size:20px}
.dlg-h p{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.dlg-b{padding:18px 22px}
.dlg-f{display:flex;gap:10px;justify-content:flex-start;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
@media (max-width:640px){
  .scrim{align-items:flex-end;padding:0}
  .dlg,.dlg.wide,.dlg.narrow{width:100%;max-height:92vh;border-radius:20px 20px 0 0;animation:sheet .25s cubic-bezier(.2,.8,.3,1)}
  .dlg-f{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .dlg-f .btn{flex:1}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}

/* toast */
.toasts{position:fixed;z-index:90;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
@media (max-width:899px){.toasts{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:min(520px,100%);padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--paper);
  font-size:14px;font-weight:600;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);animation:rise .25s ease-out}
.toast.ok svg{color:var(--trust)}
:root .toast.ok svg{color:#4FD69C}
.toast.bad svg{color:#FF8A7A}
.toast.money{background:var(--tag);color:var(--tag-ink)}
.toast a{color:inherit;font-weight:700}

/* notif dropdown */
.drop{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:380px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:70;overflow:hidden}
.ni{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:start}
.ni:last-child{border-bottom:0}
.ni:hover{background:var(--paper)}
.ni.unread{background:color-mix(in srgb,var(--tag) 9%,var(--surface))}
.ni .nic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.ni .nic.money{background:var(--trust-soft);color:var(--trust)}
.ni .nic.offer{background:var(--tag);color:var(--tag-ink)}
.ni .nic.alert{background:var(--alert-soft);color:var(--alert)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:899px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.kpi .k{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-display);font-size:30px;line-height:1.1}
.kpi .d{font-size:12px;color:var(--ink-3)}
.kpi.hot{background:var(--tag);border-color:var(--tag-2);color:var(--tag-ink)}
.kpi.hot .k,.kpi.hot .d{color:var(--tag-ink);opacity:.8}
.kpi.safe .v{color:var(--trust)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.bars .bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .bar{width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--line-2);min-height:3px}
.bars .bar.hi{background:var(--ink)}
.bars .bl{font-size:10.5px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table.tbl{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
.tbl th{text-align:start;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .th{width:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}

/* stepper */
.steps{display:flex;gap:8px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.step.on{color:var(--ink)}
.step.on b{background:var(--ink);color:var(--paper);box-shadow:none}
.step.done{color:var(--trust)}
.step.done b{background:var(--trust);color:var(--on-trust);box-shadow:none}
.step-sep{width:28px;height:1.5px;background:var(--line-2);align-self:center;flex-shrink:0}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.plans{grid-template-columns:1fr}}
.plan{padding:18px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative}
.plan:has(input:checked){box-shadow:inset 0 0 0 2px var(--ink)}
.plan input{position:absolute;opacity:0}
.plan .pp{font-family:var(--f-display);font-size:28px;line-height:1}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.plan li{display:flex;gap:6px;align-items:flex-start}
.plan li svg{color:var(--trust);margin-top:3px}

.footer{border-top:1px solid var(--line);background:var(--surface);padding-block:28px;margin-top:20px}
.footer-g{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:24px}
@media (max-width:760px){.footer-g{grid-template-columns:1fr 1fr}}
.footer h4{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.footer a{display:block;text-decoration:none;color:var(--ink);font-size:14px;padding-block:3px}
.footer a:hover{text-decoration:underline}
@media (max-width:899px){.footer{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}}

.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.callout-box{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.callout-box.tag{background:var(--tag);color:var(--tag-ink)}
.callout-box.trust{background:var(--trust-soft)}
.callout-box.warn{background:var(--warn-soft)}
.demo-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:8px;padding:4px 8px}
.total-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding-block:6px}
.total-row.grand{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.hunter{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.hunter:has(input:checked){box-shadow:inset 0 0 0 2px var(--ink)}
.hunter input{position:absolute;opacity:0}
.hav{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--ink-2)}
.found{border-radius:16px;overflow:hidden;border:2px solid var(--trust);background:var(--surface)}
.found-h{background:var(--trust);color:var(--on-trust);padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.pcard-link{text-decoration:none;color:inherit}
.pcard-link::after{content:"";position:absolute;inset:0;z-index:1}
.pcard-link:focus-visible{outline:none}
.pcard:has(.pcard-link:focus-visible){outline:2px solid var(--tag-2);outline-offset:2px}
.pcard .fav{z-index:2}
.chip:has(input:focus-visible),.hunter:has(input:focus-visible),.plan:has(input:focus-visible){outline:2px solid var(--tag-2);outline-offset:2px}
.hunter{position:relative}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
.cat:focus-visible{outline:2px solid var(--tag-2);outline-offset:2px}

.kpis.k3{grid-template-columns:repeat(3,1fr)}
@media (max-width:760px){.kpis.k3{grid-template-columns:1fr}}

.layout-2.split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:999px){.layout-2.split{grid-template-columns:1fr}}
@media (max-width:640px){.buy-row>.btn:first-child{flex:1 1 100%}.buy-row>.btn:nth-child(2){flex:1}}

.sar{font-family:'Riyal',var(--f-body);font-weight:inherit;font-style:normal}
.page-h h1,.pd-title,.band h2{font-weight:800}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:21px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:start}
.skin.on{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.skin .sw{display:flex;gap:4px}
.skin .sw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

.vin-paste{display:inline-flex;align-items:center;gap:5px;height:30px;padding-inline:10px;border-radius:8px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.55);color:var(--plate-ink);font-size:12.5px;font-weight:600;opacity:1}
.vin-paste:hover{background:rgba(255,255,255,.8)}
:root[data-theme="dark"] .vin-paste{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vin-paste{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.18)}}
.vin-top{align-items:center}

</style>

<body>
<div lang="ar" dir="rtl" id="app">
<div id="hdr"></div>
<main class="page wrap" id="view"></main>
<div id="ftr"></div>
<nav class="tabs" id="tabs" aria-label="التنقل السريع"></nav>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</div>
<script>
document.documentElement.lang='ar'; document.documentElement.dir='rtl';
/* ═══ UI icons (24px line set) ═══ */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5L16.2 16.2"/>',
  car:'<path d="M3 13l2.1-5.3A2.2 2.2 0 0 1 7.2 6.3h9.6a2.2 2.2 0 0 1 2.1 1.4L21 13v4a1 1 0 0 1-1 1h-1M3 13v4a1 1 0 0 0 1 1h1M3 13h18M9 18h6"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  home:'<path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>',
  nut:'<path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><circle cx="12" cy="12" r="3.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

}

/* Arabic normalisation for search */
function norm(s){
  return String(s||'').toLowerCase()
    .replace(/[ً-ْـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
}
const stripAl = w => (w.length>4 && w.startsWith('ال')) ? w.slice(2) : (w.length>4 && /^(وال|بال)/.test(w) ? w.slice(3) : w);
const SYN_N = SYN.map(g=>g.map(norm));
function synExpand(text){
  const t = ' '+norm(text)+' ';
  const add = [];
  SYN_N.forEach(g=>{ if(g.some(p=>t.includes(' '+p+' ')||t.includes(' '+p)||t.includes('ال'+p))) add.push(g.join(' ')); });
  return add.join(' ');
}
function partHay(p){
  if(p._hay) return p._hay;
  const s = SELLER[p.seller] || {n:''};
  const base = [p.n, CAT[p.cat]?.n, COND[p.cond], p.oem, s.n, (p.fits||[]).map(f=>f[0]+' '+f[1]).join(' ')].join(' ');
  const h = (norm(base)+' '+synExpand(p.n+' '+(CAT[p.cat]?.n||''))).split(' ').map(stripAl).join(' ');
  Object.defineProperty(p,'_hay',{value:' '+h+' ',enumerable:false,writable:true});
  return p._hay;
}
function matchQuery(p, q){
  const toks = norm(q).split(' ').filter(Boolean).map(stripAl);
  if(!toks.length) return 1;
  const hay = partHay(p); let score = 0;
  for(const t of toks){
    if(/^(19|20)\d\d$/.test(t)){ const y=+t; if(!p.fits.length || p.fits.some(f=>y>=f[2]&&y<=f[3])){score+=1; continue;} return 0; }
    if(t.length<2) continue;
    if(hay.includes(t)){ score += norm(p.n).includes(t) ? 3 : 1; continue; }
    // synonym of the token itself
    const g = SYN_N.find(g=>g.includes(t)); if(g && g.some(x=>hay.includes(x))){score+=2; continue;}
    return 0;
  }
  return score;
}

const VIN_T={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
const VIN_W=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
const VIN_YR='ABCDEFGHJKLMNPRSTVWXY';
const VDS_HINT = {'JTNB':'كامري','JTNK':'كامري','4T1B':'كامري','4T1G':'كامري','JTMH':'لاندكروزر','KMHE':'سوناتا','KMHD':'النترا','1GKS':'يوكن','1GNS':'تاهو','MR0E':'هايلكس','MR0H':'هايلكس','JN1T':'باترول','JN8A':'باترول'};
function vinClean(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IOQ]/g,c=>({I:'1',O:'0',Q:'0'}[c])).slice(0,17); }
function vinCheck(v){ let s=0; for(let i=0;i<17;i++){ if(i===8) continue; const c=v[i]; s += (/\d/.test(c)?+c:VIN_T[c])*VIN_W[i]; } const r=s%11; return (r===10?'X':String(r))===v[8]; }
function vinYear(c){ const maxY=new Date().getFullYear()+1; const i=VIN_YR.indexOf(c); if(i>=0){ let y=2010+i; if(y>maxY) y-=30; return y; } if(/[1-9]/.test(c)) return 2000+(+c); return null; }
function sampleVin(){ const b='JTNB11HK0K3'+String(Math.floor(100000+Math.random()*899999)); let s=0; for(let i=0;i<17;i++){ if(i===8) continue; const c=b[i]; s+=(/\d/.test(c)?+c:VIN_T[c])*VIN_W[i]; } const r=s%11; return b.slice(0,8)+(r===10?'X':r)+b.slice(9); }
function vinDecode(v){
  v = vinClean(v);
  if(v.length!==17) return {ok:false, v};
  const w = WMI.filter(x=>v.startsWith(x[0])).sort((a,b)=>b[0].length-a[0].length)[0];
  return {ok:true, v, wmi:v.slice(0,3), make:w?w[1]:null, country:w?w[2]:null, year:vinYear(v[9]), check:vinCheck(v), model:VDS_HINT[v.slice(0,4)]||null, serial:v.slice(11)};
}

function ask(title, body, okLabel, kind){

function toast(msg, kind, link){
  const el=document.createElement('div'); el.className='toast '+(kind||'ok');
  el.innerHTML = `${ic(kind==='bad'?'alert':kind==='money'?'lock':kind==='info'?'info':'check',18)}<span>${msg}</span>${link?` <a href="#${link[0]}">${link[1]}</a>`:''}`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 4200);
}
function notify(role, kind, title, body, link){

  if(role===S.role) toast(`<b>${esc(title)}</b> · ${esc(body)}`, kind==='money'?'money':'ok', link?[link,'افتح']:null);
}

/* ═══════════ simulation (stands in for the real backend) ═══════════ */
function later(ms, fn){ setTimeout(()=>{ try{ fn(); }catch(e){ console.error(e); } }, ms); }
const OFFER_NOTES = {
  used:['مفحوصة ومجربة قبل الفك.','من سيارة حادث خلفي، القطعة سليمة.','نظيفة وبدون لحام أو تعديل.','نرسل لك صور إضافية بالمحادثة إذا تبي.','ممشى السيارة قليل، القطعة شبه جديدة.'],
  after:['جديد تجاري درجة أولى بالكرتون.','صناعة تايوانية مطابقة للأصلي.','جديد مع ضمان مكتوب.'],
  oem:['أصلي وكالة بالكرتون مع فاتورة ضريبية.','أصلي جديد، متوفر في المستودع.'],
};
function genOffer(r){
  const done = new Set(r.offers.map(o=>o.seller));
  let cands = sellersFor(r.car.mk, r.city, r.reach, r.conds).filter(s=>!done.has(s.id) && s.id!==MY_YARD);
  if(cands.length<1) cands = sellersFor(r.car.mk, r.city, 'all', r.conds).filter(s=>!done.has(s.id) && s.id!==MY_YARD);
  if(!cands.length) return null;
  const s = pick(cands);
  let cond = s.type==='yard' ? 'used' : (r.conds.includes('after') ? 'after' : 'oem');
  if(s.type==='store' && r.conds.includes('oem') && Math.random()<.35) cond='oem';
  const base = r.budget ? r.budget*rnd(.78,1.08) : (CAT[r.cat]?.base||600)*rnd(.75,1.2);
  const price = round10(base * (cond==='oem'?1.9:cond==='after'?1.12:1));
  const same = s.city===r.city;
  return {id:uid('f'),seller:s.id,price,cond,grade:cond==='used'?(Math.random()<.65?'A':'B'):'',war:cond==='used'?pick([7,14,30]):cond==='after'?pick([90,180]):365,
    eta: same ? pick(['جاهز للاستلام اليوم','توصيل خلال 24 ساعة']) : 'شحن خلال 2–3 أيام',
    note: pick(OFFER_NOTES[cond]), t:now(), status:'pending', fresh:true};
}
function genVehicleOffer(r){
  const done = new Set(r.offers.map(o=>o.seller));
  let cands = SELLERS.filter(s=>s.type==='yard' && !done.has(s.id) && s.id!==MY_YARD && (REGION[s.city]===REGION[r.city]));
  if(!cands.length) cands = SELLERS.filter(s=>s.type==='yard' && !done.has(s.id) && s.id!==MY_YARD);
  if(!cands.length) return null;
  const s = pick(cands);
  const age = Math.max(0, new Date().getFullYear() - r.car.y);
  const dmg = {'حادث':.55,'غرق':.4,'حريق':.3,'عطل مكينة أو فتيس':.6,'سكراب (مستهلكة)':.18}[r.damage]||.5;
  const est = (r.budget || (95000*Math.pow(.86,age))*dmg*.35);
  return {id:uid('f'),seller:s.id,price:round10(est*rnd(.85,1.12)),cond:'vehicle',war:0,eta:pick(['نسحبها خلال 24 ساعة','نسحبها خلال يومين']),
    note:pick(['السطحة علينا، ونساعدك في إجراءات إسقاط المركبة.','الدفع قبل السحب عن طريق المنصة.','نقدر نعاين السيارة عندك قبل السحب.']),t:now(),status:'pending',fresh:true};
}
function simRequest(r, resumed){
  if(r.status!=='open' || !(r.simLeft>0) || r.buyer!=='me') return;
  const delays = resumed ? [3000,9000,16000,24000,33000] : [4000,9000,15000,22000,31000];
  for(let i=0;i<r.simLeft;i++){
    later(delays[i], ()=>{
      const q=findReq(r.id); if(!q || q.status!=='open' || !(q.simLeft>0)) return;
      const off = q.kind==='vehicle' ? genVehicleOffer(q) : genOffer(q);
      q.simLeft--;
      if(off){ q.offers.push(off); notify('buyer','offer',`عرض جديد: ${sar(off.price)}`, `${SELLER[off.seller].n} على «${q.part}»`, 'req-'+q.id); }
      commit();
    });
  }
}
const HUNT_STEPS = [
  null,
  (r,h)=>({s:'assigned',txt:`قبل ${h.n} المهمة`}),
  (r,h)=>({s:'visit',txt:`زار ${SELLERS.filter(s=>s.type==='yard')[1].n}: غير متوفرة`}),
  (r,h)=>({s:'visit',txt:`زار تشليحين ثانية في ${h.city}، وفي واحد منهم شبيهة يتأكد منها`}),
  (r,h)=>({s:'found',txt:'لقى القطعة وصورها'}),
];
function simHunt(r, resumed){
  if(r.kind!=='hunt' || r.status!=='open' || r.stage>=4) return;
  const gap = resumed ? 4000 : 6000; let k=0;
  for(let st=r.stage+1; st<=4; st++){
    k++;
    later(gap*k, ()=>{
      const q=findReq(r.id); if(!q || q.status!=='open' || q.stage>=st) return;
      if(!q.hunter){ const hs=HUNTERS.filter(h=>h.city===q.city); q.hunter=(hs[0]||HUNTERS[0]).id; q.fee=q.fee||HUNTER[q.hunter].fee; }
      const h=HUNTER[q.hunter]; const e=HUNT_STEPS[st](q,h); q.events.push({...e,t:now()}); q.stage=st;
      if(st===4){
        const s = sellersFor(q.car.mk, q.city, 'all', ['used']).find(x=>x.id!==MY_YARD) || SELLER.y2;
        q.found = {seller:s.id, price:round10((q.budget||CAT[q.cat]?.base||500)*rnd(.7,.95)), cond:'used', grade:'A', war:7, note:`لقيتها عند ${s.n}. حالتها ممتازة وصورتها لك، والسعر بعد التفاوض.`};
        q.status='found';
        notify('buyer','hunt','المندوب لقى قطعتك', `${q.part}: ${sar(q.found.price)}. راجعها واعتمدها`, 'req-'+q.id);
      } else if(st===1){ notify('buyer','hunt','بدأ البحث', `${h.n} قبل مهمة «${q.part}»`, 'req-'+q.id); }
      commit();
    });
  }
}
function setStatus(o, s){ o.status=s; o.events.push({s,t:now()}); if(s==='delivered') o.deliveredAt=now(); }
function simOrder(o, resumed){
  if(o.buyer==='me' && o.seller!==MY_YARD){
    if(o.status==='paid') later(resumed?3000:6000, ()=>{ const x=findOrder(o.id); if(x&&x.status==='paid'){ setStatus(x,'preparing'); notify('buyer','box','التشليح يجهز طلبك', `TS-${x.no} ${x.item.n}`, 'order-'+x.id); commit(); simOrder(x); } });
    if(o.status==='preparing') later(resumed?5000:9000, ()=>{ const x=findOrder(o.id); if(x&&x.status==='preparing'){ setStatus(x, x.deliv==='pickup'?'shipped':'shipped'); x.track = x.deliv==='pickup' ? '' : 'SP-'+Math.floor(10000+Math.random()*89999); notify('buyer','truck', x.deliv==='pickup'?'قطعتك جاهزة للاستلام':'طلبك في الطريق', `TS-${x.no} ${x.item.n}`, 'order-'+x.id); commit(); } });
  }
  if(o.buyer!=='me' && o.seller===MY_YARD){
    if(o.status==='shipped') later(8000, ()=>{ const x=findOrder(o.id); if(x&&x.status==='shipped'){ setStatus(x,'delivered'); notify('seller','box','استلم المشتري القطعة', `TS-${x.no}: بدأت مدة الفحص 48 ساعة`, 'seller-orders'); commit(); simOrder(x); } });
    if(o.status==='delivered' && o.fastRelease) later(9000, ()=>{ const x=findOrder(o.id); if(x&&x.status==='delivered'){ releaseOrder(x,'أكد المشتري سلامة القطعة'); commit(); } });
  }
}
function sellerNet(o){ return Math.round(o.price*(1-(o.seller===MY_YARD&&S.yard?S.yard.comm:0.07))); }
function releaseOrder(o, why){
  setStatus(o,'released');
  if(o.seller===MY_YARD){
    S.ledger.unshift({id:uid('l'),t:now(),kind:'credit',amt:sellerNet(o),txt:'صافي بيع: '+o.item.n,ref:'TS-'+o.no});
    notify('seller','money',`تحول ${sar(sellerNet(o))} لمحفظتك`, `TS-${o.no} ${why||''}`, 'seller-wallet');
  }
  if(o.buyer==='me') notify('buyer','money','تم تحويل المبلغ للبائع', `TS-${o.no} ${o.item.n}. قيّم تجربتك`, 'order-'+o.id);
}
function tickOrders(){
  let ch=false;
  S.orders.forEach(o=>{ if(o.status==='delivered' && o.deliveredAt && now()-o.deliveredAt>48*HR){ releaseOrder(o,'انتهت مدة الفحص بدون ملاحظات'); ch=true; } });
  S.requests.forEach(r=>{ if((r.status==='open') && r.exp && now()>r.exp && r.buyer==='me'){ r.status='expired'; ch=true; } });
  if(ch) commit();
}
function resumeSims(){
  S.requests.forEach(r=>{ if(r.kind==='hunt') simHunt(r,true); else simRequest(r,true); });
  S.orders.forEach(o=>simOrder(o,true));
}
/* alerts: notify buyer when a newly listed part matches a saved search */
function checkAlerts(p){
  S.alerts.forEach(a=>{ if(matchQuery(p,a.q)>0){ const c=S.garage.find(x=>x.id===a.carId); if(!c || fitStatus(p,c)!=='no'){ notify('buyer','zap','توفرت القطعة اللي تنتظرها', `${p.n}: ${sar(p.price)} عند ${SELLER[p.seller].n}`, 'part-'+p.id); } } });
}

function hdrHTML(){
  const seller = S.role==='seller';
  const nav = seller

/* photos: read + downscale */
function readImages(files, max, cb){
  [...files].slice(0, max).forEach(f=>{
    if(!f.type.startsWith('image/')) return;
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 900/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.78)); }; img.src = fr.result; };
    fr.readAsDataURL(f);
  });
}
function uploadsHTML(list, key, max){
  return `<div class="uploads">${list.map((src,i)=>`<div class="up-img"><img src="${src}" alt="صورة ${i+1}"><button type="button" data-a="rmPhoto" data-key="${key}" data-i="${i}" aria-label="احذف الصورة">${ic('x',14)}</button></div>`).join('')}
    ${list.length<max?`<label class="up-add">${ic('camera',22)}<span>أضف صورة</span><input type="file" accept="image/*" multiple data-c="addPhoto" data-key="${key}" data-max="${max}"></label>`:''}</div>`;
}

function partsList(){
  const car = activeCar();
  let L = S.parts.filter(livePart).map(p=>({p, s: UI.q ? matchQuery(p, UI.q) : 1})).filter(x=>x.s>0);
  if(UI.fit && car) L = L.filter(x=>{ const f=fitStatus(x.p,car); return f==='ok'||f==='uni'; });
  if(UI.cond!=='all') L = L.filter(x=>x.p.cond===UI.cond);
  if(UI.cats.length) L = L.filter(x=>UI.cats.includes(x.p.cat));
  if(UI.city) L = L.filter(x=>SELLER[x.p.seller].city===UI.city);
  if(UI.pmin) L = L.filter(x=>x.p.price>=+UI.pmin);
  if(UI.pmax) L = L.filter(x=>x.p.price<=+UI.pmax);
  if(UI.war) L = L.filter(x=>x.p.war>0);
  if(UI.verified) L = L.filter(x=>SELLER[x.p.seller].verified);
  const by = {rel:(a,b)=>b.s-a.s||b.p.ts-a.p.ts, low:(a,b)=>a.p.price-b.p.price, high:(a,b)=>b.p.price-a.p.price, new:(a,b)=>b.p.ts-a.p.ts, rating:(a,b)=>SELLER[b.p.seller].rating-SELLER[a.p.seller].rating};
  return L.sort(by[UI.sort]||by.rel).map(x=>x.p);
}

  return null;

function coCalc(it){
  const co = UI.co; const s = SELLER[it.seller]; const size = CAT[it.cat]?.size||'m';
  const addr = S.addresses.find(a=>a.id===co.addr) || S.addresses[0];
  const destCity = addr ? addr.city : S.user.city;
  const opts = [['pickup',`استلام من ${s.dist}، ${s.city}`,0,'تستلمها بنفسك من الموقع وتفحصها قبل ما تطلع']];
  if(s.city===destCity) opts.push(['city',`توصيل داخل ${s.city}`,SIZE_FEE[size].city,'خلال 24 ساعة مع مندوب التوصيل']);
  else opts.push(['ship',`شحن إلى ${destCity}`,SIZE_FEE[size].ship,'2–4 أيام، مؤمّن ضد الكسر']);
  if(!co.deliv || !opts.some(o=>o[0]===co.deliv)) co.deliv = opts[1][0];
  const delivFee = opts.find(o=>o[0]===co.deliv)[2];
  const fee = serviceFee(it.price);
  const total = it.price + it.hunterFee + delivFee + fee;
  return {s, opts, delivFee, fee, total, addr};
}

function orderTimeline(o){

function threadName(t){ return t.side==='buyer' ? SELLER[t.seller].n : t.buyer; }
function threadAv(t){ return t.side==='buyer' ? yav(SELLER[t.seller]) : `<span class="hav" style="width:48px;height:48px">${esc(t.buyer[0])}</span>`; }
function msgsHTML(t){
  return t.msgs.map(m=>{
    if(m.from==='sys') return `<div class="sysmsg">${ic('eyeOff',15)}<span>${esc(m.text)}</span></div>`;
    if(m.offer) return `<div class="offer-bubble"><div class="ob-h">${ic('tag',16)}عرض سعر</div><div class="ob-b"><b>${esc(m.offer.n)}</b><div class="row" style="justify-content:space-between">${ptag(m.offer.price)}<a class="btn btn-trust btn-sm" href="#part-${m.offer.partId}">اشترِ</a></div></div></div>`;
    return `<div class="msg ${m.from==='me'?'me':'them'}">${m.img?`<img src="${m.img}" alt="صورة مرسلة">`:''}${m.text?renderMsgText(m.text):''}<span class="tm">${clock(m.t)}</span></div>`
      + (m.masked && m.from==='them' ? `<div class="sysmsg">${ic('eyeOff',15)}<span>أخفينا رقم جوال من الرسالة. التواصل والدفع داخل المنصة هو اللي يضمن حقك.</span></div>` : '');
  }).join('') + (UI.typing===t.id?'<div class="typing" aria-label="يكتب"><i></i><i></i><i></i></div>':'');
}
function vMessages(id){
  const list = S.threads.filter(t=>t.side===S.role);
  const t = id ? S.threads.find(x=>x.id===id) : (window.innerWidth>=900 ? list[0] : null);
  if(t && t.unread){ t.unread=0; AFTER.push(()=>{ save(); updateBadges(); }); }
  AFTER.push(()=>{ const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight; });
  return `<div class="page-h hide-m"><div><h1>الرسائل</h1></div></div>
  ${t?`<a class="back show-m" href="#messages">${ic('back',18)}كل المحادثات</a>`:'<h1 class="show-m" style="font-family:var(--f-display);font-size:25px;margin-bottom:14px">الرسائل</h1>'}
  <div class="chat ${t?'has-thread':''}">
    <div class="chat-list">${list.length?list.map(x=>`<a class="ci ${t&&x.id===t.id?'on':''}" href="#chat-${x.id}">${threadAv(x)}<div style="min-width:0"><div class="b small ell">${esc(threadName(x))}</div><div class="tiny muted ell">${x.msgs.length?esc((x.msgs[x.msgs.length-1].text||'صورة').replace(/⟦رقم مخفي⟧/g,'[رقم مخفي]')):esc(x.refTxt)}</div></div>${x.unread?`<span class="badge num">${x.unread}</span>`:`<span class="tiny faint">${x.msgs.length?ago(x.msgs[x.msgs.length-1].t):''}</span>`}</a>`).join(''):`<p class="small muted" style="padding:20px">ما فيه محادثات. تقدر تراسل أي تشليح من صفحة القطعة أو العرض.</p>`}</div>
    ${t?`<div class="chat-main">
      <div class="chat-h">${threadAv(t)}<div class="grow" style="min-width:0"><b class="ell" style="display:block">${esc(threadName(t))}</b>${t.ref?`<a href="#${t.ref}" class="tiny muted">${esc(t.refTxt)}</a>`:''}</div></div>
      <div class="chat-guard">${ic('shield',15)}المحادثة محمية: أرقام الجوال تنخفي تلقائياً، والدفع داخل المنصة فقط</div>
      <div class="msgs" id="msgs" aria-live="polite">${msgsHTML(t)}</div>
      <form class="composer" data-f="send" data-id="${t.id}"><label class="icon-btn att" aria-label="أرسل صورة">${ic('camera',20)}<input type="file" accept="image/*" data-c="chatImg" data-id="${t.id}"></label><input class="inp" name="m" placeholder="اكتب رسالتك" autocomplete="off" aria-label="الرسالة"><button class="btn btn-ink" style="width:44px;padding:0;border-radius:50%" aria-label="أرسل">${ic('send',18)}</button></form>
    </div>`:`<div class="chat-main hide-m" style="display:grid;place-items:center"><p class="muted small">اختر محادثة</p></div>`}
  </div>`;
}
function updateThread(){ const id=CUR.args[0]; const t=id&&S.threads.find(x=>x.id===id); const box=$('#msgs'); if(t&&box){ box.innerHTML=msgsHTML(t); box.scrollTop=box.scrollHeight; } }
function replyFor(text, side){
  const n = norm(text);
  if(side==='seller') return /متى|وين|شحن/.test(n) ? 'تمام، أنتظر رقم الشحنة.' : 'تمام، مشكور.';
  if(/سعر|كم|بكم|خصم|اخر/.test(n)) return 'السعر مثل ما هو بالعرض. إذا أخذت أكثر من قطعة نعطيك خصم.';
  if(/متوفر|موجود|عندك/.test(n)) return 'إيه متوفرة الحين. اطلبها من صفحة القطعة والمبلغ يبقى محجوز في المنصة لين تستلم.';
  if(/توصيل|شحن|مندوب|يوصل/.test(n)) return 'نسلمها لمندوب التوصيل اليوم، وتوصلك داخل المدينة خلال 24 ساعة.';
  if(/صور|صوره|فيديو/.test(n)) return 'أبشر، أصورها لك الحين من كل الجهات.';
  if(/ضمان|ترجيع|رجع/.test(n)) return 'عليها ضمان تركيب. إذا ما اشتغلت ترجعها خلال مدة الفحص.';
  if(/تركب|يركب|توافق|هيكل/.test(n)) return 'أرسل لي رقم الهيكل وأتأكد لك من رقم القطعة.';
  return 'أبشر، وصلت رسالتك.';
}
F.send = f => {
  const t = S.threads.find(x=>x.id===f.dataset.id); const raw=f.m.value.trim(); if(!raw) return;
  const g = guardText(raw); t.msgs.push({from:'me',text:g.text,t:now(),masked:g.masked});
  if(g.masked) t.msgs.push({from:'sys',text:'أخفينا رقم الجوال من رسالتك. خلّ التواصل هنا عشان نقدر نحمي حقك لو صار خلاف.',t:now()});
  else if(g.offsite) t.msgs.push({from:'sys',text:'تنبيه: الدفع أو التحويل خارج المنصة ما يشمله الضمان، وما نقدر نرجع لك المبلغ.',t:now()});
  f.m.value=''; save(); updateThread();
  UI.typing = t.id; later(900, ()=>{ if(UI.typing===t.id) updateThread(); });
  later(2400, ()=>{ UI.typing=null; t.msgs.push({from:'them',text:replyFor(raw,t.side),t:now()}); if(CUR.args[0]!==t.id) t.unread=(t.unread||0)+1; save(); if(CUR.fn===vMessages) updateThread(); updateBadges(); });
};

/* ═══════════ SELLER (yard) side ═══════════ */
function incoming(){
  const me = myYard();
  return S.requests.filter(r=>r.kind==='part' && r.buyer!=='me' && me.mk.includes(r.car.mk) && (r.status==='open' || r.offers.some(o=>o.seller===MY_YARD))
    && (r.target? r.target===MY_YARD : (r.reach==='all' || (r.reach==='region' && REGION[r.city]===REGION[me.city]) || r.city===me.city || r.offers.some(o=>o.seller===MY_YARD)))
    && !(r.hiddenFor||[]).includes(MY_YARD));
}
const myOffer = r => r.offers.find(o=>o.seller===MY_YARD);
const myOrders = () => S.orders.filter(o=>o.seller===MY_YARD);
function wallet(){
  const held = myOrders().filter(o=>['paid','preparing','shipped','delivered','disputed'].includes(o.status)).reduce((a,o)=>a+sellerNet(o),0);
  const credits = S.ledger.filter(l=>l.kind==='credit').reduce((a,l)=>a+l.amt,0);
  const out = S.ledger.filter(l=>l.kind==='withdraw').reduce((a,l)=>a+l.amt,0);
  const month = S.ledger.filter(l=>l.kind==='credit' && now()-l.t<30*DAY).reduce((a,l)=>a+l.amt,0);
  return {held, avail:Math.max(0,credits-out), month};
}
function salesBars(){
  const days = []; for(let i=13;i>=0;i--){ const d0 = new Date(); d0.setHours(0,0,0,0); const st = d0.getTime()-i*DAY; days.push({st, v:S.ledger.filter(l=>l.kind==='credit' && l.t>=st && l.t<st+DAY).reduce((a,l)=>a+l.amt,0)}); }
  const max = Math.max(1,...days.map(d=>d.v));
  return `<div class="bars" role="img" aria-label="المبيعات اليومية لآخر 14 يوم">${days.map((d,i)=>`<div class="bw" title="${dateTxt(d.st)}: ${fmt(d.v)} ريال"><div class="bar ${i===13?'hi':''}" style="height:${Math.max(2,d.v/max*100)}%"></div><span class="bl num">${new Date(d.st).getDate()}</span></div>`).join('')}</div>`;
}
function sreqCard(r, compact){
  const mo = myOffer(r); const comp = (r.others||0) + r.offers.filter(o=>o.seller!==MY_YARD).length;
  const stMap = {pending:['بانتظار قرار المشتري','p-warn live'],accepted:['قبل عرضك ودفع','p-trust'],declined:['اختار عرض ثاني','p-mute']};
  return `<article class="offer" style="--oc:${compact?'72px':'96px'}">
    ${plate(r.d||CAT[r.cat]?.d||'engine')}
    <div class="stack" style="gap:6px;min-width:0">
      <b>${esc(r.part)}</b>
      <div class="meta-line"><span>${ic('car',14)}${esc(r.car.mk)} ${esc(r.car.md)} ${r.car.y}</span><span>${ic('pin',14)}${esc(r.buyer==='me'?S.user.city:r.city)}</span><span>${ic('clock',14)}${ago(r.t)}</span></div>
      ${compact?'':`<div class="row wrap" style="gap:6px">${r.conds.map(c=>`<span class="cond ${c}">${COND[c]}</span>`).join('')}${r.budget?`<span class="small">ميزانيته <b class="num">${sar(r.budget)}</b></span>`:''}</div>
      ${r.notes?`<p class="small muted">«${esc(r.notes)}»</p>`:''}`}
      <div class="small muted">${comp?`${comp} ${comp===1?'عرض منافس':comp===2?'عرضين منافسين':'عروض منافسة'}`:'ما وصله عرض للحين، كن الأول'}</div>
    </div>
    <div class="offer-acts" style="min-width:${compact?'120px':'150px'}">
      ${mo?`<div>${ptag(mo.price)}</div><span class="pill ${stMap[mo.status][1]}">${stMap[mo.status][0]}</span>`
        : r.status==='open'?`<button class="btn btn-tag btn-sm" data-a="offerModal" data-id="${r.id}">${ic('tag',16)}قدّم عرض</button>${compact?'':`<button class="btn btn-quiet btn-sm" data-a="hideReq" data-id="${r.id}">ما عندي</button>`}`:'<span class="pill p-mute">انتهى</span>'}
    </div></article>`;
}
