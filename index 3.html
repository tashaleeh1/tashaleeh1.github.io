function vSellerWallet(){
  const w = wallet(); const heldN = myOrders().filter(o=>['paid','preparing','shipped','delivered','disputed'].includes(o.status)).length;
  return `<div class="page-h"><div><h1>المحفظة</h1><p class="sub">الباقة ${planName()}: عمولة المنصة ${Math.round(S.yard.comm*100)}% من سعر القطعة فقط. التوصيل ورسوم الحماية يدفعها المشتري.</p></div></div>
  <div class="kpis k3">
    <div class="kpi"><span class="k">${ic('lock',16)}محجوز لك</span><span class="v num">${fmt(w.held)} <span class="sar">⃁</span></span><span class="d">${heldN} ${heldN===1?'طلب':'طلبات'}، يتحول بعد استلام المشتري أو انتهاء مدة الفحص</span></div>
    <div class="kpi safe"><span class="k">${ic('wallet',16)}متاح للسحب</span><span class="v num">${fmt(w.avail)} <span class="sar">⃁</span></span><span class="d"><button class="btn btn-trust btn-sm" data-a="withdraw" ${w.avail<100?'disabled':''} style="margin-top:4px">اسحب للحساب البنكي</button></span></div>
    <div class="kpi"><span class="k">${ic('receipt',16)}صافي هالشهر</span><span class="v num">${fmt(w.month)} <span class="sar">⃁</span></span><span class="d">صافي بعد العمولة</span></div>
  </div>
  <div class="layout-2" style="margin-top:22px">
    <section class="stack" style="min-width:0"><h2 style="font-size:19px">الحركات</h2>
      <div class="tbl-wrap"><table class="tbl" style="min-width:560px"><thead><tr><th>التاريخ</th><th>الوصف</th><th>المرجع</th><th>المبلغ (⃁)</th></tr></thead><tbody>
      ${S.ledger.slice().sort((a,b)=>b.t-a.t).slice(0,30).map(l=>`<tr><td class="small muted" style="white-space:nowrap">${dateTxt(l.t)}</td><td class="small">${esc(l.txt)}${l.status==='pending'?' <span class="pill p-warn">قيد التحويل</span>':''}</td><td class="small mono">${esc(l.ref||'')}</td><td class="num b" style="color:${l.kind==='credit'?'var(--trust)':'var(--ink)'}">${l.kind==='credit'?'+':'−'}${fmt(l.amt)}</td></tr>`).join('')}</tbody></table></div></section>
    <aside class="stack sticky"><div class="card pad stack"><b>الحساب البنكي</b><div class="row">${ic('bank',22)}<div class="grow"><div class="small b">${esc(S.yard.holder)}</div><div class="mono small">${maskIban(S.yard.iban)}</div></div></div><button class="btn btn-ghost btn-sm" data-a="editIban">${ic('edit',16)}غيّر الحساب</button>
      <p class="tiny muted">التحويل لحسابك خلال يوم عمل. لازم يكون اسم صاحب الحساب مطابق للسجل التجاري.</p></div></aside>
  </div>`;
}
A.withdraw = () => { const w=wallet(); modal(`${dlgHead('اسحب الرصيد',`المتاح ${sar(w.avail)}`)}<form data-f="withdraw" novalidate><div class="dlg-b stack"><div class="field"><label for="wd-amt">المبلغ (⃁)</label><input class="inp num" id="wd-amt" name="amt" type="number" inputmode="numeric" value="${w.avail}" max="${w.avail}"><span class="err" id="wd-err"></span></div><div class="small muted">إلى ${esc(S.yard.holder)} · <span class="mono">${maskIban(S.yard.iban)}</span></div></div><div class="dlg-f"><button class="btn btn-trust">اسحب</button><button type="button" class="btn btn-ghost" data-a="close">تراجع</button></div></form>`,'narrow'); };
F.withdraw = f => {
  const w=wallet(); const a=+f.amt.value;
  if(!a || a<100){ $('#wd-err').textContent='أقل مبلغ للسحب 100 ⃁'; return; } if(a>w.avail){ $('#wd-err').textContent='المبلغ أكبر من المتاح'; return; }
  const l={id:uid('l'),t:now(),kind:'withdraw',amt:a,txt:'سحب إلى الحساب البنكي',status:'pending'}; S.ledger.unshift(l); closeModal(); commit(); toast(`طلبنا تحويل ${sar(a)} لحسابك`);
  later(5000,()=>{ l.status='done'; notify('seller','money','وصل التحويل لحسابك', `${sar(a)} إلى ${maskIban(S.yard.iban)}`, 'seller-wallet'); commit(); });
};
A.editIban = () => modal(`${dlgHead('الحساب البنكي')}<form data-f="iban" novalidate><div class="dlg-b stack">
  <div class="field"><label for="ib-h">اسم صاحب الحساب</label><input class="inp" id="ib-h" name="holder" value="${esc(S.yard.holder)}"></div>
  <div class="field"><label for="ib-n">الآيبان</label><input class="inp mono" id="ib-n" name="iban" dir="ltr" placeholder="SA00 0000 0000 0000 0000 0000" data-i="ibanLive" maxlength="34"><span class="hint" id="ib-hint">24 خانة تبدأ بـ SA</span></div>
  </div><div class="dlg-f"><button class="btn btn-ink">احفظ</button><button type="button" class="btn btn-ghost" data-a="close">تراجع</button></div></form>`,'narrow');
I.ibanLive = el => { const v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,''); el.value = v.replace(/(.{4})/g,'$1 ').trim(); const h=el.closest('.field').querySelector('.hint'); const ok=V.iban(v);
  el.classList.toggle('good', ok); el.classList.toggle('bad', v.length>=24 && !ok); h.textContent = ok?'آيبان صحيح':v.length>=24?'الآيبان غير صحيح، راجع الأرقام':`${v.length} من 24 خانة`; h.style.color = ok?'var(--trust)':v.length>=24?'var(--alert)':''; };
F.iban = f => { const v=f.iban.value.replace(/\s/g,''); if(!V.iban(v)){ toast('الآيبان غير صحيح','bad'); return; } S.yard.iban=v; S.yard.holder=f.holder.value.trim()||S.yard.holder; closeModal(); commit(); toast('انحفظ الحساب البنكي'); };

/* ═══════════ JOIN (seller onboarding) ═══════════ */
route(/^join$/, vJoin, true);
function planName(){ const p = PLANS.find(x=>x[0]===(S.yard&&S.yard.plan)); return p?p[1]:''; }
const PLANS = [['basic','أساسية','مجاناً',9,['حتى 50 قطعة معروضة','عمولة 9% على كل بيع','الطلبات الواردة في مدينتك']],['pro','احترافية','199 ⃁ / شهر',7,['قطع غير محدودة','عمولة 7%','الطلبات من كل المنطقة','أولوية في ظهور عروضك']],['plus','مميزة','449 ⃁ / شهر',5,['كل مزايا الاحترافية','عمولة 5%','ظهور مميز في البحث','تقارير الطلب على القطع في منطقتك']]];
function vJoin(){
  const st = UI.joinStep, J = UI.join;
  const steps = ['المنشأة','التخصص','الحساب البنكي','الباقة'];
  const head = `<div class="steps">${steps.map((s,i)=>`${i?'<span class="step-sep"></span>':''}<span class="step ${i+1<st?'done':i+1===st?'on':''}"><b>${i+1<st?ic('check',14):i+1}</b>${s}</span>`).join('')}</div>`;
  let body = '';
  if(st===1) body = `<div class="stack">
    <div class="field"><span class="lbl">نوع المنشأة</span><div class="grid2">${[['yard','تشليح','قطع مستعملة من سيارات الحوادث'],['store','محل قطع غيار','قطع جديدة تجارية أو وكالة']].map(([v,l,d])=>`<label class="radio-card"><input type="radio" name="type" value="${v}" ${(J.type||'yard')===v?'checked':''}><div><b>${l}</b><div class="small muted">${d}</div></div></label>`).join('')}</div></div>
    <div class="grid2"><div class="field"><label for="j-name">اسم المنشأة كما في السجل</label><input class="inp" id="j-name" name="name" value="${esc(J.name||'')}" placeholder="مؤسسة تشليح ..."></div>
      <div class="field"><label for="j-cr">رقم السجل التجاري أو الرقم الموحد</label><input class="inp mono" id="j-cr" name="cr" dir="ltr" inputmode="numeric" maxlength="10" value="${esc(J.cr||'')}" placeholder="7001234567" data-i="crLive"><span class="hint">10 أرقام. الرقم الموحد يبدأ بـ 7</span></div></div>
    <div class="grid2"><div class="field"><label for="j-city">المدينة</label><select class="sel" id="j-city" name="city">${selOpts(CITIES,J.city||'الرياض')}</select></div>
      <div class="field"><label for="j-dist">الحي أو المنطقة الصناعية</label><input class="inp" id="j-dist" name="dist" value="${esc(J.dist||'')}" placeholder="حي السلي"></div></div>
    <div class="field"><label for="j-ph">جوال المسؤول</label><input class="inp mono" id="j-ph" name="phone" dir="ltr" inputmode="tel" value="${esc(J.phone||'')}" placeholder="05XXXXXXXX"></div></div>`;
  if(st===2) body = `<div class="stack">
    <div class="field"><span class="lbl">الشركات اللي تتخصص فيها</span><div class="chips">${Object.keys(MAKES).map(m=>`<label class="chip sm ${(J.mk||[]).includes(m)?'on':''}" style="cursor:pointer"><input type="checkbox" class="sr" name="mk" value="${m}" ${(J.mk||[]).includes(m)?'checked':''} data-c="chipCheck">${m}</label>`).join('')}</div><span class="hint">توصلك الطلبات اللي تخص هالشركات فقط</span></div>
    <div class="field"><span class="lbl">الأقسام اللي عندك</span><div class="chips">${CATS.map(c=>`<label class="chip sm ${(J.cats||CATS.map(x=>x.id)).includes(c.id)?'on':''}" style="cursor:pointer"><input type="checkbox" class="sr" name="cats" value="${c.id}" ${(J.cats||CATS.map(x=>x.id)).includes(c.id)?'checked':''} data-c="chipCheck">${c.n}</label>`).join('')}</div></div>
    <label class="switch"><input type="checkbox" name="ship" ${J.ship!==false?'checked':''}>أشحن لكل مدن المملكة</label></div>`;
  if(st===3) body = `<div class="stack">
    <div class="callout-box trust">${ic('lock',18)}<span class="small">مبالغ مبيعاتك تتحول لهالحساب بعد ما يستلم المشتري. لازم يكون باسم المنشأة نفسها.</span></div>
    <div class="field"><label for="j-holder">اسم صاحب الحساب</label><input class="inp" id="j-holder" name="holder" value="${esc(J.holder||J.name||'')}"></div>
    <div class="field"><label for="j-iban">الآيبان</label><input class="inp mono" id="j-iban" name="iban" dir="ltr" maxlength="34" value="${esc(J.iban||'')}" placeholder="SA03 8000 0000 6080 1016 7519" data-i="ibanLive"><span class="hint">24 خانة تبدأ بـ SA</span></div></div>`;
  if(st===4) body = `<div class="plans">${PLANS.map(([v,l,p,c,fs])=>`<label class="plan"><input type="radio" name="plan" value="${v}" ${(J.plan||'pro')===v?'checked':''}><b>${l}</b><span class="pp">${p}</span><ul>${fs.map(x=>`<li>${ic('check',14)}${x}</li>`).join('')}</ul></label>`).join('')}</div><p class="small muted" style="margin-top:12px">تقدر تغيّر الباقة أو تلغيها أي وقت. أول شهر من الاحترافية مجاناً.</p>`;
  if(st===5) return `<div class="card pad-l" style="max-width:640px;margin:20px auto"><div class="stack" style="align-items:flex-start">
    <span class="vi" style="width:56px;height:56px;border-radius:16px;background:var(--trust);color:var(--on-trust);display:grid;place-items:center">${ic('check',28)}</span>
    <h1 style="font-family:var(--f-display);font-size:28px">استلمنا طلب تسجيل ${esc(J.name||'منشأتك')}</h1><p class="muted">نراجع البيانات ونفعّل حسابك خلال يوم عمل. هذي الخطوات اللي بنسويها:</p>
    <div class="tl" style="width:100%"><div class="tl-i done"><span class="tl-d">${ic('check',15)}</span><div><div class="tl-t">استلام الطلب</div><div class="tl-s">الحين</div></div></div>
      <div class="tl-i now"><span class="tl-d">${ic('doc',15)}</span><div><div class="tl-t">التحقق من السجل التجاري <span class="mono small">${esc(J.cr||'')}</span></div><div class="tl-s">نطابق الاسم والنشاط مع بيانات وزارة التجارة</div></div></div>
      <div class="tl-i"><span class="tl-d">${ic('bank',15)}</span><div><div class="tl-t">مطابقة الحساب البنكي</div><div class="tl-s">إيداع تجريبي بهللات نتأكد فيه من الآيبان</div></div></div>
      <div class="tl-i"><span class="tl-d">${ic('shield',15)}</span><div><div class="tl-t">تفعيل الحساب وشارة «موثّق»</div><div class="tl-s">وتبدأ توصلك الطلبات</div></div></div></div>
    <div class="row wrap"><button class="btn btn-tag" data-a="role" data-v="seller">افتح لوحة المنشأة</button><a class="btn btn-ghost" href="#home">الرئيسية</a></div></div></div>`;
  return `<div class="page-h"><div><h1>سجّل منشأتك</h1><p class="sub">تشليح أو محل قطع غيار. تحتاج السجل التجاري والآيبان، والتسجيل ياخذ خمس دقائق.</p></div></div>
  <form class="card pad-l" style="max-width:820px" data-f="join" novalidate>${head}${body}<p class="err" id="j-err" style="margin-top:12px"></p>
    <div class="row" style="margin-top:18px;gap:10px">${st>1?`<button type="button" class="btn btn-ghost" data-a="joinBack">${ic('back',18)}رجوع</button>`:''}<button class="btn btn-ink">${st===4?'أرسل الطلب':'التالي'}${st<4?ic('fwd',18):''}</button></div></form>`;
}
I.crLive = el => { el.value = el.value.replace(/\D/g,'').slice(0,10); el.classList.toggle('good', V.cr(el.value)); el.classList.toggle('bad', el.value.length===10 && !V.cr(el.value)); };
A.joinBack = () => { UI.joinStep--; render(false); };
F.join = f => {
  const J = UI.join, st = UI.joinStep, err = m => { $('#j-err').textContent = m; };
  if(st===1){ const d={type:f.type.value,name:f.name.value.trim(),cr:f.cr.value.trim(),city:f.city.value,dist:f.dist.value.trim(),phone:f.phone.value.replace(/\s/g,'')};
    if(d.name.length<3) return err('اكتب اسم المنشأة'); if(!V.cr(d.cr)) return err('رقم السجل لازم يكون 10 أرقام ويبدأ برقم من 1 إلى 7'); if(!d.dist) return err('اكتب الحي'); if(!V.phone(d.phone)) return err('رقم الجوال لازم يبدأ بـ 05 ويكون 10 أرقام'); Object.assign(J,d); }
  if(st===2){ const mk=$$('input[name=mk]:checked',f).map(x=>x.value); if(!mk.length) return err('اختر شركة وحدة على الأقل'); J.mk=mk; J.cats=$$('input[name=cats]:checked',f).map(x=>x.value); J.ship=f.ship.checked; }
  if(st===3){ const v=f.iban.value.replace(/\s/g,'').toUpperCase(); if(!f.holder.value.trim()) return err('اكتب اسم صاحب الحساب'); if(!V.iban(v)) return err('الآيبان غير صحيح. تأكد إنه 24 خانة ويبدأ بـ SA'); J.holder=f.holder.value.trim(); J.iban=v; }
  if(st===4){ J.plan=f.plan.value;
    if(needAuth(()=>F.join(f))) return;
    const plan = PLANS.find(p=>p[0]===J.plan);
    S.myYard = {id:'me',n:J.name,ab:J.name.replace(/^(تشليح|تشاليح|مؤسسة|شركة|محل|مستودع)\s+/,'').trim()[0]||J.name[0],type:J.type,city:J.city,dist:J.dist,km:0,rating:0,reviews:0,resp:0,verified:false,since:new Date().getFullYear(),deals:0,mk:J.mk,about:''};
    S.yard = {iban:J.iban, holder:J.holder, plan:J.plan, comm:plan[3]/100};
    registerMyYard(); save();
  }
  UI.joinStep++; render(false);
};

/* ═══════════ boot ═══════════ */
S = load() || seedState();
registerMyYard();
if(S.theme!=='system') applyTheme(); else applySkin();
render(false);
resumeSims();
tickOrders();
setInterval(tickOrders, 30000);

</script>
</body>
</html>
